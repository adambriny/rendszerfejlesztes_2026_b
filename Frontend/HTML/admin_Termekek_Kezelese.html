<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/admin_Account.css">
    <link rel="stylesheet" href="../CSS/admin_Termekek_Kezelese.css">
    <title>Termékek kezelése – CASEFLOW</title>
</head>
<body>
    <!-- Fejléc (Összhangban a főoldallal és a fiókom oldallal) -->
    <header class="fejlec">
    <div class="logo">
        <a href="../../index.html">
            <img src="../PNG/logo12.png" class="logo-kep">
        </a>
    </div>
        <div class="kereso-sav">
            <input type="text" placeholder="Keresés telefonmodell vagy minta szerint...">
        </div>
        <div class="fejlec-gombok">
            <a href="../HTML/admin_Account.html">
                <button class="fiok-gomb">Fiókom</button>
            </a>
            <div class="admin-badge">ADMIN</div>
        </div>
    </header>

    <!-- Fő tartalom -->
    <main class="admin-konténer">
        <h1 class="admin-cim">Termékek kezelése</h1>

        <div class="admin-tartalom">
            <!-- Oldalsáv gombjai -->
            <aside class="oldalsav">
                <a href="../HTML/admin_Account.html">
                    <button class="menu-gomb">Személyes adatok</button>
                </a>
                <a href="../HTML/admin_Termekek_Kezelese.html">
                    <button class="menu-gomb">Termékek kezelése</button>
                </a>
                <a href="../HTML/felhasznalo_Kezeles.html">
                    <button class="menu-gomb">Felhasználók kezelése</button>
                </a>
                <button
                    type="button"
                    class="menu-gomb"
                    onclick="adminMenuUzenetMegjelenitese('A rendeléskezelő felület még nem érhető el.')">
                    Rendelések kezelése
                </button>

                <button
                    type="button"
                    class="menu-gomb"
                    onclick="adminMenuUzenetMegjelenitese('A jelszómódosítási felület még nem érhető el.')">
                    Jelszó módosítása
                </button>

                <p id="adminMenuUzenet" class="admin-menu-uzenet" role="status" aria-live="polite"></p>
                <button class="kijelentkezes-gomb" onclick="kijelentkezes()">Kijelentkezés</button>
            </aside>

            <!-- Termékkezelő fő panel -->
            <section class="termek-menedzser">
                
                <!-- Lista vezérlők: Új termék gomb és kereső/szűrő -->
                <div class="lista-vezerlok">
                    <div class="uj-termek-sor">
                        <button class="gomb-kerek gomb-primer" onclick="ujTermekLetrehozasa()">+ Új termék</button>
                    </div>
                    <div class="szuro-sor">
                        <input type="text" id="keresoInput" placeholder="Keresés terméknév szerint..." oninput="szuresFunkcio()">
                        <select id="markaSzuro" onchange="szuresFunkcio()">
                            <option value="">Márka: Összes</option>
                            <option value="Apple">Apple</option>
                            <option value="Samsung">Samsung</option>
                            <option value="Huawei">Huawei</option>
                        </select>
                    </div>
                </div>

                <!-- Termék lista doboza -->
                <div class="termek-lista-doboz">
                    <div class="lista-fejlec-sor">
                        Kép - Terméknév - Modell - Ár - Készlet - Műveletek
                    </div>
                    <div id="termekLista"></div>
                    <p id="adminUzenet" role="status"></p>
                </div>

                <!-- Űrlap panel (Szerkesztés / Új termék) -->
                <section class="adat-panel" id="formSzekcio">
                    <h2 class="panel-cim" id="formCim">Termék szerkesztése / új termék</h2>
                    
                    <form id="termekForm" onsubmit="termekMentese(event)">
                        <div class="urlap-grid">
                            <div class="input-csoport">
                                <label for="termekNev">Név *</label>
                                <input type="text" id="termekNev" value="Átlátszó MagSafe tok" required>
                            </div>
                            
                            <div class="input-csoport">
                                <label for="termekModell">Modell</label>
                                <select id="termekModell" required></select>
                            </div>
                            <div class="input-csoport">
                                <label for="termekMarka">Márka</label>
                                <select id="termekMarka" required></select>
                            </div>
                            <div class="input-csoport">
                                <label for="termekAnyag">Anyag</label>
                                <select id="termekAnyag"></select>
                            </div>
                            <div class="input-csoport">
                                <label for="termekSzin">Szín</label>
                                <select id="termekSzin"></select>
                            </div>
                            <div class="input-csoport">
                                <label for="termekMinta">Minta</label>
                                <select id="termekMinta"></select>
                            </div>
                            <div class="input-csoport">
                                <label for="termekAr">Ár (Ft) *</label>
                                <input type="number" id="termekAr" value="8990" required>
                            </div>
                            <div class="input-csoport">
                                <label for="termekKeszlet">Készlet (db) *</label>
                                <input type="number" id="termekKeszlet" value="12" required>
                            </div>
                            <div class="input-csoport">
                                <label>Kép feltöltése *</label>
                                <label class="fajl-feltolto">
                                    Tallózás...
                                    <input type="file" id="termekKep" accept="image/*">
                                </label>
                            </div>
                        </div>

                        <div class="akcio-gombok">
                            <button type="submit" class="gomb-kerek gomb-primer">Mentés</button>
                            <button type="button" class="gomb-kerek gomb-szekunder" onclick="formUrites()">Mégse</button>
                        </div>
                    </form>
                </section>

            </section>
        </div>
    </main>
    <script src="../JS/admin_Termekek_Kezelese.js"></script>
</body>
</html>
