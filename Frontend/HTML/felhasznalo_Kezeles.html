<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../CSS/felhasznalo_Kezeles.css">
    <link rel="stylesheet" href="../CSS/admin_Account.css">
    <link rel="stylesheet" href="../CSS/admin_Termekek_Kezelese.css">
    <title>Felhasználók kezelése – CASEFLOW</title>
</head>
<body>
    <!-- Fejléc (Összhangban a többi admin oldallal) -->
    <header class="fejlec">
            <div class="logo">
        <img src="../PNG/logo12.png" class="logo-kep">
    </div>
        <div class="kereso-sav">
            <input type="text" placeholder="Keresés telefonmodell vagy minta szerint...">
        </div>
        <div class="fejlec-gombok">
            <a href="../HTML/admin_Account.html">
                <button class="fiok-gomb">Fiókom</button>
            </a>
            <div class="admin-badge">ADMIN</div>
        </div>
    </header>

    <!-- Fő tartalom -->
    <main class="admin-konténer">
        <h1 class="admin-cim">Felhasználók kezelése</h1>

        <div class="admin-tartalom">
            <!-- Oldalsáv gombjai (A megfelelő hivatkozásokkal) -->
            <aside class="oldalsav">
                <a href="../HTML/admin_Account.html">
                    <button class="menu-gomb">Személyes adatok</button>
                </a>
                <a href="../HTML/admin_Termekek_Kezelese.html">
                    <button class="menu-gomb">Termékek kezelése</button>
                </a>
                <button class="menu-gomb aktiv">Felhasználók kezelése</button>
                <button
                    type="button"
                    class="menu-gomb"
                    onclick="adminMenuUzenetMegjelenitese('A rendeléskezelő felület még nem érhető el.')">
                    Rendelések kezelése
                </button>

                <button
                    type="button"
                    class="menu-gomb"
                    onclick="adminMenuUzenetMegjelenitese('A jelszómódosítási felület még nem érhető el.')">
                    Jelszó módosítása
                </button>

                <p id="adminMenuUzenet" class="admin-menu-uzenet" role="status" aria-live="polite"></p>
                <button class="kijelentkezes-gomb" onclick="kijelentkezes()">Kijelentkezés</button>
            </aside>

            <!-- Felhasználókezelő fő panel a jobb oldalon -->
            <section class="felhasznalo-menedzser">
                
                <!-- Keresés és Szerepkör szűrés sor -->
                <div class="szuro-sor">
                    <input type="text" id="keresoInput" placeholder="Keresés név vagy e-mail szerint..." oninput="felhasznaloSzures()">
                    <select id="szerepSzuro" onchange="felhasznaloSzures()">
                        <option value="">Szerepkör: Összes</option>
                        <option value="vasarlo">Regisztrált vásárló</option>
                        <option value="admin">Adminisztrátor</option>
                    </select>
                </div>

                <!-- Felhasználói táblázat / lista doboz -->
                <div class="felhasznalo-lista-doboz">
                    <div class="lista-fejlec-sor">
                        Név - E-mail - Állapot - Szerepkör - Művelet
                    </div>

                    <div id="felhasznaloLista"></div>
                    <p id="adminUzenet" role="status"></p>
                </div>

                <!-- Szaggatott vonalas Megerősítés Panel (Alaphelyzetben rejtett, JS jeleníti meg) -->
                <div id="megerositoPanel" class="szaggatott-panel" style="display: none;">
                    <h3 class="szaggatott-cim">Megerősítés szerepkör módosításakor</h3>
                    <p class="szaggatott-szoveg">Biztosan <span id="ujSzerepNev">Adminisztrátor</span> szerepkört adsz <span id="celFelhasznaloNev">Kiss Bence</span> részére?</p>
                    
                    <div class="szaggatott-gombok">
                        <button class="megerosit-gomb" onclick="szerepVeglegesites()">Igen, módosítom</button>
                        <button class="megse-gomb" onclick="szerepMegse()">Mégse</button>
                    </div>
                </div>

                <!-- Alsó figyelmeztető felirat -->
                <p class="admin-figyelmeztetes">A saját admin fiók szerepköre nem módosítható, így az admin nem zárhatja ki magát.</p>

            </section>
        </div>
    </main>
    <script src="../JS/felhasznalo_Kezeles.js"></script>
</body>
</html>
